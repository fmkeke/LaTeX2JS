<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaTeX2JS 组件库</title>
  <link rel="stylesheet" href="../packages/css/latex2js.css">
</head>
<body class="m-0 p-0 bg-gradient-to-br from-gray-50 via-blue-50 to-purple-50 font-sans min-h-screen">
  <div class="max-w-[1600px] mx-auto px-4 py-8">
    <!-- 头部标题 -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-gray-800 mb-2 bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
        🎨 LaTeX2JS 组件库
      </h1>
      <p class="text-gray-600 text-sm mb-4">所有可用的 PSTricks 组件示例</p>
      <div class="flex justify-center gap-3">
        <a href="./index.html" class="px-4 py-2 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-lg text-sm font-semibold shadow-md hover:shadow-lg transition-all transform hover:scale-105">
          🧪 返回测试页面
        </a>
      </div>
    </div>

    <!-- 组件展示区域 -->
    <div id="components-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- 组件卡片将通过 JavaScript 动态生成 -->
      <div class="col-span-full text-center py-8 text-gray-500">
        正在加载组件库...
      </div>
    </div>
  </div>

  <script type="module">
    // 简单的测试，确保脚本能执行
    console.log('组件库页面脚本开始执行');
    
    // 检查容器是否存在
    const testContainer = document.getElementById('components-container');
    if (testContainer) {
      console.log('✓ 找到容器元素');
    } else {
      console.error('✗ 未找到容器元素');
    }
    
    // 导入主脚本
    import('./components.ts').catch(err => {
      console.error('导入 components.ts 失败:', err);
      const container = document.getElementById('components-container');
      if (container) {
        container.innerHTML = `
          <div class="col-span-full text-center py-8">
            <div class="text-red-600 text-lg font-bold mb-2">脚本加载失败</div>
            <div class="text-gray-600 text-sm">${err.message}</div>
            <div class="text-gray-500 text-xs mt-4">请检查浏览器控制台获取更多信息</div>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
