<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaTeX2JS Component Preview</title>
  <link rel="stylesheet" href="../packages/css/latex2js.css">
</head>
<body class="m-0 p-0 bg-gradient-to-br from-gray-50 via-blue-50 to-purple-50 font-sans min-h-screen">
  <div class="max-w-[1600px] mx-auto px-4 py-8">
    <!-- 头部标题 -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-gray-800 mb-2 bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
        🧪 LaTeX2JS 完整功能测试
      </h1>
      <p class="text-gray-600 text-sm mb-4">测试所有支持的 LaTeX/PSTricks 命令和功能</p>
      <div class="flex justify-center gap-3">
        <a href="./components.html" class="px-4 py-2 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg text-sm font-semibold shadow-md hover:shadow-lg transition-all transform hover:scale-105">
          🎨 查看组件库
        </a>
      </div>
    </div>

    <!-- 测试模板标签页 -->
    <div id="tabs" class="flex flex-wrap gap-3 mb-6 bg-white/80 backdrop-blur-sm p-4 rounded-xl shadow-lg border border-gray-200"></div>

    <!-- 双栏布局：代码和预览 -->
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
      <!-- 代码面板 -->
      <div class="bg-white/90 backdrop-blur-sm rounded-xl shadow-lg border border-gray-200 overflow-hidden">
        <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-4">
          <div class="flex items-center gap-3">
            <div class="w-1 h-6 bg-white rounded-full"></div>
            <h2 class="text-lg font-bold text-white">LaTeX 代码</h2>
          </div>
        </div>
        
        <div class="p-5">
          <!-- 测试描述 -->
          <div id="test-description" class="bg-gradient-to-r from-blue-50 to-purple-50 p-4 rounded-lg mb-4 border-l-4 border-blue-600 shadow-sm">
            <div class="text-sm text-gray-700 leading-relaxed"></div>
          </div>
          
          <!-- 代码编辑器 -->
          <div class="relative">
            <textarea 
              id="latex-input" 
              placeholder="LaTeX 代码将显示在这里..." 
              class="w-full min-h-[450px] p-4 border-2 border-gray-300 rounded-lg font-mono text-sm resize-y leading-relaxed focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all bg-gray-50 hover:bg-white"
            ></textarea>
            <div class="absolute top-2 right-2 text-xs text-gray-400 bg-white/80 px-2 py-1 rounded">
              LaTeX
            </div>
          </div>
          
          <!-- 操作按钮 -->
          <div class="flex gap-3 mt-4">
            <button 
              onclick="renderCurrent()" 
              class="flex-1 px-6 py-3 bg-gradient-to-r from-blue-600 to-blue-700 text-white rounded-lg text-sm font-semibold shadow-md hover:shadow-lg hover:from-blue-700 hover:to-blue-800 transition-all transform hover:scale-[1.02] active:scale-[0.98]"
            >
              ✨ 渲染
            </button>
            <button 
              onclick="clearPreview()" 
              class="px-6 py-3 bg-gray-100 text-gray-700 rounded-lg text-sm font-semibold shadow-sm hover:bg-gray-200 transition-all transform hover:scale-[1.02] active:scale-[0.98]"
            >
              🗑️ 清空
            </button>
          </div>
        </div>
      </div>

      <!-- 预览面板 -->
      <div class="bg-white/90 backdrop-blur-sm rounded-xl shadow-lg border border-gray-200 overflow-hidden">
        <div class="bg-gradient-to-r from-green-600 to-emerald-600 p-4">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-1 h-6 bg-white rounded-full"></div>
              <h2 class="text-lg font-bold text-white">预览效果</h2>
            </div>
            <span 
              id="status-badge" 
              class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-yellow-100 text-yellow-800 shadow-sm"
            >
              ⏳ 待渲染
            </span>
          </div>
        </div>
        
        <div class="p-5">
          <div 
            id="preview" 
            class="min-h-[450px] border-2 border-dashed border-gray-300 p-6 rounded-lg bg-gradient-to-br from-gray-50 to-white"
          >
            <div class="flex flex-col items-center justify-center h-full text-gray-500">
              <div class="text-6xl mb-4">📝</div>
              <div class="text-center italic">请选择一个测试模板并点击"渲染"按钮</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 页脚信息 -->
    <div class="mt-8 text-center text-sm text-gray-500">
      <p>LaTeX2JS - 将 LaTeX 转换为 JavaScript 渲染的组件库</p>
    </div>
  </div>

  <script type="module" src="./preview.ts"></script>
</body>
</html>
